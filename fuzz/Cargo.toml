[package]
name = "phygital-key-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
phygital-key-verify = { path = "../crates/phygital-key-verify" }

# Not part of the main workspace (needs nightly Rust).
[workspace]
members = ["."]

[[bin]]
name = "verify"
path = "fuzz_targets/verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "strict_json"
path = "fuzz_targets/strict_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "keyring_history"
path = "fuzz_targets/keyring_history.rs"
test = false
doc = false
bench = false

[[bin]]
name = "standing"
path = "fuzz_targets/standing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proof"
path = "fuzz_targets/proof.rs"
test = false
doc = false
bench = false
