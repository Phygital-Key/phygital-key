name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, exe: phygital-key }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, exe: phygital-key }
          - { os: macos-latest, target: aarch64-apple-darwin, exe: phygital-key }
          - { os: macos-15-intel, target: x86_64-apple-darwin, exe: phygital-key }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, exe: phygital-key.exe }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write       # build provenance (who built each file, from which commit)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p phygital-key --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="phygital-key-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" README.md LICENSE NOTICE "$name/"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "$name.zip" "$name" > /dev/null
            sha256sum "$name.zip" > "$name.zip.sha256"
          else
            tar czf "$name.tar.gz" "$name"
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
      # A signed record (GitHub build provenance) that this workflow built these
      # exact files from this tag's commit. Anyone can check it with
      # `gh attestation verify <file> --repo Phygital-Key/phygital-key-mcp`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            phygital-key-*.tar.gz
            phygital-key-*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: |
            phygital-key-*.tar.gz*
            phygital-key-*.zip*

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The "release" environment holds the release signing key and waits until the
    # repository owner approves this run on GitHub ("Review deployments").
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: src
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          path: dist
      - name: Sign the release list (release.txt)
        shell: bash
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          V="$GITHUB_REF_NAME"
          [[ "$V" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad tag $V"; exit 1; }
          [ -n "$RELEASE_SIGNING_KEY" ] || { echo "no RELEASE_SIGNING_KEY in the release environment: run scripts/release-key.sh"; exit 1; }
          cd dist
          {
            echo "phygital-key release manifest v1"
            echo "version $V"
            for f in $(ls phygital-key-"$V"-*.tar.gz phygital-key-"$V"-*.zip | sort); do
              echo "$(sha256sum "$f" | cut -d ' ' -f 1)  $f"
            done
          } > release.txt
          [ "$(wc -l < release.txt)" -ge 3 ] || { echo "no release files"; exit 1; }
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/release-key.pem"
          openssl dgst -sha256 -sign "$RUNNER_TEMP/release-key.pem" -out release.txt.sig release.txt
          rm -f "$RUNNER_TEMP/release-key.pem"
          # The signature must check out with a key pinned in this commit's installer.
          awk '/-----BEGIN PUBLIC KEY-----/{n++; f="pin-" n ".pem"} f{print > f} /-----END PUBLIC KEY-----/{close(f); f=""}' \
            ../src/crates/phygital-key/assets/install-service.sh
          ok=no
          for k in pin-*.pem; do
            [ -f "$k" ] && openssl dgst -sha256 -verify "$k" -signature release.txt.sig release.txt >/dev/null && ok=yes
          done
          rm -f pin-*.pem
          [ "$ok" = yes ] || { echo "the signature does not match a key pinned in install-service.sh"; exit 1; }
          cat release.txt
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/phygital-key-*
            dist/release.txt
            dist/release.txt.sig
          generate_release_notes: true
