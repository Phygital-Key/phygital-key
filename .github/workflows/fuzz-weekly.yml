name: fuzz-weekly

# The CI fuzz job gives each target 60 seconds on every push. This one gives
# each target 30 minutes once a week, side by side, to reach rarer inputs.
# A crash fails the run and keeps the input that caused it as an artifact.
on:
  schedule:
    - cron: "41 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }} (30 min)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [verify, strict_json, keyring_history, standing, proof]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: nightly
      - run: cargo install --locked cargo-fuzz
      - name: Run
        working-directory: fuzz
        env:
          TARGET: ${{ matrix.target }}
        run: cargo +nightly fuzz run "$TARGET" -- -max_total_time=1800
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts/
