# Weekly update checks. Each update arrives as a pull request and goes through the
# full CI (tests, both verifiers, end-to-end, secure install) before anyone merges it.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
