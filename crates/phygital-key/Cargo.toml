[package]
name = "phygital-key"
description = "Phygital Key gate: an MCP server and approval page so a person approves exact AI actions with a passkey or hardware key."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["mcp", "webauthn", "passkey", "approval", "ai-agents"]
categories = ["authentication", "command-line-utilities"]

[[bin]]
name = "phygital-key"
path = "src/main.rs"

[dependencies]
phygital-key-verify.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
getrandom.workspace = true
subtle.workspace = true
p256.workspace = true
rmcp = { version = "3.5", features = ["server", "macros", "schemars", "elicitation", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-std"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
clap = { version = "4", features = ["derive", "env"] }
url = "2"

[dev-dependencies]
base64.workspace = true


[lints]
workspace = true
