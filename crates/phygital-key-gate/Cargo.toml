[package]
name = "phygital-key-gate"
description = "The Phygital Key gate engine: approval page, keys, standing approvals, receipts, audit log, secure install and signed updates, shared by every Phygital Key product (MCP, A2A)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["webauthn", "passkey", "approval", "ai-agents", "human-in-the-loop"]
categories = ["authentication"]

[lib]
path = "src/lib.rs"

[dependencies]
phygital-key-verify.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
getrandom.workspace = true
subtle.workspace = true
p256.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-std"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
# Already under axum: used directly to serve each connection with a header timeout.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "service"] }
clap = { version = "4", features = ["derive", "env"] }
url = "2"

[dev-dependencies]
base64.workspace = true


[lints]
workspace = true
